<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSC Candidate Manager</title><link rel="stylesheet" href="candidate-admin.css"></head><body><header><h1>SSC Candidate Manager</h1><a href="index.html">Website</a></header><main><section id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="doLogin">Login</button><p id="loginMsg"></p></section><section id="manager" class="hidden"><div class="bar"><h2>Candidate Management</h2><button id="logout">Logout</button></div><section class="card"><h3>Create Candidate</h3><div class="grid"><input id="cEmail" type="email" placeholder="Candidate email"><input id="cPassword" type="password" placeholder="Temporary password (8+)"><input id="cReg" placeholder="Registration number"><input id="cName" placeholder="Full name"><input id="cRoll" placeholder="Roll number"><input id="cPhone" placeholder="Phone"><input id="cDob" type="date"><input id="cCategory" placeholder="Category"><input id="cFather" placeholder="Father name"><input id="cMother" placeholder="Mother name"><input id="cState" placeholder="State"><input id="cCity" placeholder="City"><input id="cPin" placeholder="PIN"><input id="cAddress" placeholder="Address"><button id="createCandidate">Create Candidate</button></div><p id="createMsg"></p></section><section class="card"><h3>Find Candidate</h3><div class="row"><input id="search" placeholder="Registration number or email"><button id="find">Search</button></div><div id="candidateList"></div></section><section id="editor" class="card hidden"><h3 id="editName">Candidate</h3><input id="eId" type="hidden"><div class="grid"><input id="eReg" placeholder="Registration"><input id="eRoll" placeholder="Roll"><input id="eName" placeholder="Name"><input id="ePhone" placeholder="Phone"><input id="eDob" type="date"><input id="eCategory" placeholder="Category"><input id="eFather" placeholder="Father"><input id="eMother" placeholder="Mother"><input id="eState" placeholder="State"><input id="eCity" placeholder="City"><input id="ePin" placeholder="PIN"><input id="eStatus" placeholder="Status"><textarea id="eAddress" placeholder="Address"></textarea></div><button id="saveCandidate">Save Candidate</button><hr><h4>Publish Marks / Selection</h4><div class="grid"><input id="rExam" placeholder="Exam"><input id="rPost" placeholder="Post"><input id="rMarks" type="number" placeholder="Marks"><input id="rMax" type="number" placeholder="Max Marks"><input id="rRank" placeholder="Rank"><input id="rSelection" placeholder="Selection status"><input id="rDate" type="date"><input id="rRemarks" placeholder="Remarks"><label><input id="rPublish" type="checkbox" checked> Publish to candidate</label><button id="saveResult">Publish Result</button></div><hr><h4>Publish Message</h4><input id="mTitle" placeholder="Message title"><textarea id="mBody" placeholder="Message"></textarea><button id="saveMessage">Publish Message</button><div id="editMsg"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="candidate-admin.js"></script></body></html>
