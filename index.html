<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staff Selection Commission</title>
<meta name="theme-color" content="#2d1113">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=20260827-results-fix"></script>
<script src="private-rti.js"></script>
<script>
(function(){
  const map={'brand-reference.jpg':'brand.jpg','government-emblem.png':'emblem-header.jpg','hero-reference.jpg':'hero.jpg'};
  function fix(){document.querySelectorAll('img[src]').forEach(function(img){const n=(img.getAttribute('src')||'').split('/').pop();if(map[n])img.setAttribute('src','assets/'+map[n]);});}
  fix(); new MutationObserver(fix).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});
})();
</script>
</body>
</html>
