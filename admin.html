<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSC Content Manager</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin"><div class="admin-head"><div><h1>SSC Content Manager</h1><p>Private admin area — manage notices and shared files.</p></div><a href="index.html">View Website</a></div><div id="status" class="status">Demo mode: add Supabase URL + anon key in config.js for shared management.</div><section class="panel" id="authPanel"><h2>Admin Login</h2><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button></div><p class="muted">Create the admin account in Supabase Authentication → Users.</p></section><section class="grid" id="manager" hidden><section class="panel"><h2>Upload File</h2><input id="file" type="file"><input id="title" placeholder="Display title"><button id="upload">Upload to shared Storage</button><div id="uploadMsg" class="muted"></div></section><section class="panel"><h2>Add Notice</h2><input id="noticeTitle" placeholder="Notice title"><input id="noticeDate" type="date"><input id="noticeSize" placeholder="File size, e.g. 873.66 KB"><button id="saveNotice">Save Notice</button></section></section><section class="panel" id="contentPanel" hidden><h2>Published Notices</h2><div id="noticeList"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></main></body></html>
