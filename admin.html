<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSC Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin"><header class="adminhead"><div><h1>SSC Content Manager</h1><p>Manage notices, PDFs and shared files.</p></div><a href="index.html">View Website</a></header><div id="status" class="status">Checking Supabase configuration…</div><section id="auth" class="panel"><h2>Admin Login</h2><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button></div><small>Create the admin account in Supabase Authentication → Users.</small></section><section id="manager" hidden><div class="grid"><section class="panel"><h2>Upload File</h2><input id="file" type="file"><input id="fileTitle" placeholder="File display title"><button id="upload">Upload File</button><p id="uploadMsg"></p></section><section class="panel"><h2>Publish Notice</h2><input id="noticeTitle" placeholder="Notice title"><input id="noticeDate" type="date"><input id="noticeSize" placeholder="File size"><input id="noticePath" placeholder="Uploaded file path" readonly><button id="publish">Publish Notice</button></section></div><section class="panel"><h2>Publish Result</h2><div class="row"><select id="resultCategory"><option value="CGL">CGL</option><option value="STENOGRAPHER">STENOGRAPHER</option><option value="CHSL">CHSL</option><option value="JEN">JEN</option><option value="CAPF">CAPF</option><option value="CTGD">CTGD</option><option value="CHT">CHT</option><option value="OTHERS">OTHERS</option><option value="DEPARTMENTAL EXAMS">DEPARTMENTAL EXAMS</option><option value="DPHM">DPHM</option><option value="RHQ">RHQ</option><option value="DPCE">DPCE</option><option value="DPCD">DPCD</option><option value="DPHCT">DPHCT</option><option value="CEDP">CEDP</option><option value="MTS">MTS</option></select><input id="resultTitle" placeholder="Result title"><input id="resultDate" type="date"><input id="resultSize" placeholder="File size"></div><button id="publishResult">Publish Result</button><p id="resultMsg"></p></section><section class="panel"><h2>Published Results</h2><div id="resultList"></div></section><section class="panel"><div class="paneltitle"><h2>Published Notices</h2><button id="refresh">Refresh</button></div><div id="noticeList"></div></section><section class="panel"><h2>Session</h2><button id="logout">Logout</button></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="config.js"></script><script src="admin.js"></script><script src="admin-candidates.js"></script><script src="admin-admit-generator.js"></script><script src="admin-official-letters.js"></script></body></html>
